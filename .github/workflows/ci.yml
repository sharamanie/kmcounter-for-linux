name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      # 失败时把摘要打成注解（::error::）：不用登录、不用翻日志，
      # 在 Actions 页面的 “Annotations” 里就能直接看到哪个测试挂了、为什么挂。
      # 注意显式指定 bash：Windows runner 默认是 pwsh，这里的管道/PIPESTATUS 只在 bash 下成立
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if cargo test --locked 2>&1 | tee /tmp/test.log; then
            exit 0
          fi
          echo "::error::cargo test 失败，摘要如下"
          grep -aE "error(\[|:)|panicked at|^failures:|^test result:|assertion|  left:|  right:|No such file" /tmp/test.log \
            | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          tail -15 /tmp/test.log | while IFS= read -r line; do echo "::error::tail | $line"; done
          exit 1

      # softshot 特性 = 无 GPU 的软件光栅化出图，附带界面交互测试（点击分布条/按键）
      - name: Test (softshot feature)
        shell: bash
        run: |
          set -o pipefail
          if cargo test --locked --features softshot 2>&1 | tee /tmp/softshot.log; then
            exit 0
          fi
          echo "::error::cargo test (softshot) 失败，摘要如下"
          grep -aE "error(\[|:)|panicked at|^failures:|^test result:|assertion|  left:|  right:|No such file" /tmp/softshot.log \
            | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          tail -15 /tmp/softshot.log | while IFS= read -r line; do echo "::error::tail | $line"; done
          exit 1

      - name: Build release
        run: cargo build --release --locked

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kmcounter-${{ matrix.name }}
          path: target/release/kmcounter

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kmcounter-${{ matrix.name }}
          path: target/release/kmcounter.exe

  # 打 tag（v*）时把两个平台的二进制发成 GitHub Release。
  # 说明文字放在 .github/release-notes/<tag>.md，没有该文件时退化为只有标题。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: kmcounter-*
          merge-multiple: true

      - name: Rename assets
        run: |
          mv kmcounter kmcounter-linux-x86_64
          mv kmcounter.exe kmcounter-windows-x86_64.exe
          chmod +x kmcounter-linux-x86_64

      - name: Pick release notes
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            printf '%s\n' "$GITHUB_REF_NAME" > "$NOTES"
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等：同一个 tag 重推（例如只改了发布说明）时更新正文与产物，而不是报“已存在”
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "KMCounter-rs ${GITHUB_REF_NAME}" --notes-file "$NOTES"
            gh release upload "${GITHUB_REF_NAME}" kmcounter-linux-x86_64 kmcounter-windows-x86_64.exe --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "KMCounter-rs ${GITHUB_REF_NAME}" --notes-file "$NOTES" \
              kmcounter-linux-x86_64 kmcounter-windows-x86_64.exe
          fi
